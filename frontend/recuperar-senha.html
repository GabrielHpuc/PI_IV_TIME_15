<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | AgroRecursos</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/marketplace.css">
  <script src="js/recuperar-senha.js" defer></script>
</head>
<body class="rec-page">
  <main class="rec-main">
    <section class="rec-card">
      <a class="rec-brand" href="index.html">
        <span class="rec-brand-logo"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19c3-5 6-8 10-10"/></svg></span>
        <span class="rec-brand-text"><strong>AgroRecursos</strong><small>MarketPlace</small></span>
      </a>

      <h1 class="rec-titulo">RECUPERAR SENHA</h1>
      <div class="rec-linha" aria-hidden="true"></div>

      <form id="recovery-form" class="rec-form">
        <label for="email">Seu E-mail de Cadastro</label>
        <div class="rec-campo">
          <input id="email" name="email" type="email" autocomplete="email" placeholder="exemplo@dominio.com" required>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </div>
        <p class="rec-ajuda">Digite o e-mail associado à sua conta para receber o link de recuperação.</p>

        <button class="rec-botao" type="submit">Enviar Link de Recuperação →</button>
        <p id="message" class="form-message rec-mensagem" role="status"></p>
      </form>
    </section>

    <footer class="rec-rodape">
      <nav aria-label="Rodapé">
        <a href="#">Sobre Nós</a>
        <a href="#">Termos de Uso</a>
        <a href="#">Ajuda</a>
        <a href="#">Contato</a>
      </nav>
      <p>© 2026 AgroRecursos MarketPlace</p>
    </footer>
  </main>
</body>
</html>
