
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | AgroRecursos</title>
  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="/">AgroRecursos</a>
    <h1>Bem-vindo de volta</h1>
    <p class="muted">Entre para acessar sua conta.</p>

    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required maxlength="254"
        autocomplete="email" placeholder="seu@email.com">

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required
        maxlength="72" autocomplete="current-password"
        placeholder="Sua senha">

      <div class="forgot-link">
        <a href="/esqueci-senha.html">Esqueci minha senha</a>
      </div>

      <button class="button full-width" type="submit">Entrar</button>
      <p id="message" class="form-message" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-footer">
      Ainda não tem conta? <a href="/cadastro.html">Criar conta</a>
    </p>
  </main>
</body>
</html>
